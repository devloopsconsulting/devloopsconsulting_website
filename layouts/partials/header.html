<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="DevLoops Consulting home">
      <img src="{{ "img/devloops-mark.png" | relURL }}" alt="" width="52" height="26">
      <span class="brand-name"><span class="brand-dev">DevLoops</span> <span class="brand-con">Consulting</span></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu"><span></span><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {{- $current := .RelPermalink }}
      {{- range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if eq .URL $current }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <a class="btn btn-small" href="{{ "contact/#book" | relURL }}">Book a call</a>
    </nav>
  </div>
</header>
