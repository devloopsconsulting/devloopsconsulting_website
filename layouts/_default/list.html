{{ define "main" }}
<section class="page-head">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
</section>
<div class="page-body">
  <div class="wrap">
    <ul class="post-list">
      {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="post-date">{{ .Date.Format "2 January 2006" }}</span>
        {{ with .Summary }}<p>{{ . | plainify | truncate 180 }}</p>{{ end }}
      </li>
      {{ else }}
      <li><p>No posts yet.</p></li>
      {{ end }}
    </ul>
  </div>
</div>
{{ end }}
