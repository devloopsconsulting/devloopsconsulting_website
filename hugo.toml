baseURL = "https://devloopsconsulting.com"
title = "DevLoops Consulting"
author = "Ashwin Thanalapati"
languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]
# The site uses its own templates in /layouts. The old "tella" theme is no longer used.

[services]
  [services.googleAnalytics]
    # GA4 measurement ID (Admin > Data streams > Web). Empty = no tracking.
    ID = "G-Y6E08XC2NV"

[params]
  description = "DevOps and cloud infrastructure consulting for robotics, autonomy, and software teams. Senior-led, based in Abu Dhabi, working worldwide."
  email = "contact@devloopsconsulting.com"
  location = "Abu Dhabi, UAE"
  linkedin = "https://www.linkedin.com/in/ashwinmurali/"
  x = "https://x.com/cruisemaniac"
  formspree = "https://formspree.io/f/xkgbgypy"
  # Google Calendar booking page link (Calendar > booking page > Share > Copy link).
  # Leave empty to hide the scheduler on the Contact page.
  bookingURL = "https://calendar.google.com/calendar/appointments/schedules/AcZssZ2M0HspWFVvnIAM5mq_HMNY28wPVLeqWS1_9YIKbmKEeFIxpzZaLJOmsshxNcn6Z-mSB9RIxsVi"
  ogImage = "img/devloops-mark.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = "services"
    name = "Services"
    url = "/services/"
    weight = 1

  [[menu.main]]
    identifier = "robotics"
    name = "Robotics"
    url = "/services/#robotics"
    weight = 2

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3

